<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Campus Lost & Found — Choose Account</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;color:#fff;background:#05070f;display:grid;place-items:center;padding:24px}.wrap{width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;gap:22px}.card,.art{border:1px solid #ffffff12;border-radius:28px;background:#0d1220ee;box-shadow:0 25px 80px #0008;backdrop-filter:blur(16px)}.card{padding:34px}.art{min-height:570px;padding:34px;display:flex;align-items:end;background:linear-gradient(160deg,#0d1220aa,#0d1220f5),url('/img/campus-night.png') center/cover}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;background:linear-gradient(135deg,#6366f1,#22d3ee)}h1{font-size:38px;line-height:1.08;margin:30px 0 10px}.muted{color:#98a2b3;line-height:1.6}.roles{display:grid;gap:12px;margin:28px 0}.role{border:1px solid #ffffff12;background:#ffffff05;color:white;border-radius:18px;padding:18px;text-align:left;cursor:pointer}.role.active{border-color:#818cf855;background:#6366f11f}.role b{display:block;margin-bottom:5px}.role span{font-size:13px;color:#98a2b3}label{display:block;font-size:12px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.08em;margin:15px 0 7px}input{width:100%;border:1px solid #ffffff12;background:#05070fcc;color:#fff;border-radius:12px;padding:13px}button.submit{width:100%;margin-top:20px;border:0;border-radius:13px;padding:14px;color:#fff;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#6366f1,#8b5cf6)}.note{font-size:11px;color:#727d91;margin-top:12px}.error{font-size:13px;color:#fda4af;margin-top:12px}.hidden{display:none}@media(max-width:760px){.wrap{grid-template-columns:1fr}.art{display:none}h1{font-size:32px}}
</style></head>
<body>
<main class="wrap">
<section class="card">
<div class="brand"><div class="logo">LF</div><div><b>Smart Campus</b><div class="muted" style="font-size:12px">Lost & Found</div></div></div>
<h1>Choose your account</h1><p class="muted">Select how you want to access the campus lost & found portal.</p>
<div class="roles">
<button type="button" class="role active" data-role="student"><b>Student Account</b><span>Report items, search reports, view matches and manage your claims.</span></button>
<button type="button" class="role" data-role="administrator"><b>Administrator Account</b><span>Review reports, verify claims and manage return handovers.</span></button>
</div>
<form id="login">
<label>Campus email</label><input id="email" type="email" placeholder="you@campus.edu" required>
<label>Password</label><input id="password" type="password" minlength="4" placeholder="Enter your password" required>
<button class="submit" type="submit">Continue as <span id="roleText">Student</span></button>
<div id="err" class="error hidden"></div>
<div class="note">This login layer stores the selected role for the existing demo portal.</div>
</form></section>
<aside class="art"><div><h2>Find. Match. Verify. Return.</h2><p class="muted">One trusted campus record for lost and found belongings.</p></div></aside>
</main>
<script>
let role='student';
const buttons=[...document.querySelectorAll('.role')], roleText=document.getElementById('roleText'), err=document.getElementById('err');
buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>x.classList.remove('active'));b.classList.add('active');role=b.dataset.role;roleText.textContent=role==='student'?'Student':'Administrator';err.classList.add('hidden')});
document.getElementById('login').onsubmit=e=>{e.preventDefault();const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||password.length<4){err.textContent='Enter a valid campus email and a password of at least 4 characters.';err.classList.remove('hidden');return}localStorage.setItem('lf-auth',JSON.stringify({email,role,loggedIn:true}));localStorage.setItem('lf-role',role==='administrator'?'staff':'student');location.href='/portal'};
</script></body></html>
